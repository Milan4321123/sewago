services:
  - type: web
    name: sewago
    runtime: node
    plan: starter
    # HARD CONSTRAINT: exactly one instance. App state lives in process memory
    # (flushed to the state store); a second instance would fork and corrupt it.
    # Scaling out requires the Postgres migration first.
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # Set to supabase_rows once docs/supabase-schema.sql has been applied
      # (the app auto-imports the blob on first boot; blob is kept for rollback).
      - key: DATA_STORE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_ID
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Per-driver KYC code, issued out-of-band. NEVER set
      # ALLOW_DEMO_VERIFICATION_IN_PRODUCTION here — it would let anyone
      # self-verify as a driver with the shared demo code.
      - key: DRIVER_LICENSE_DEMO_CODE
        sync: false
      - key: OTP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Password-reset email delivery: resend | sendgrid | webhook.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Payment gateways go live automatically once their keys are present.
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: KHALTI_MODE
        value: live
      - key: ESEWA_PRODUCT_CODE
        sync: false
      - key: ESEWA_SECRET
        sync: false
      - key: ESEWA_MODE
        value: live
      # NOTE: ALLOW_SANDBOX_PROVIDERS_IN_PRODUCTION is intentionally NOT set.
      # Production must fail closed — it will refuse to boot until real Twilio,
      # email, and payment-gateway keys are configured above. Never add the flag
      # to take real money: it would let the PIN-1234 sandbox mint free balance.
